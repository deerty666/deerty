<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحايب ديرتي - حجز مؤقت</title>
    <style>
        :root { --blue: #2c3e50; --accent: #3498db; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f7f9; overflow: hidden; }

        /* 🛒 السلة */
        .sidebar { width: 380px; background: white; border-left: 2px solid #ddd; display: flex; flex-direction: column; }
        
        /* 📋 ترويسة الفاتورة الجديدة */
        .sidebar-header { padding: 10px; background: var(--blue); color: white; text-align: center; }
        .booking-header { background: #f8f9fa; border: 2px solid #333; margin: 5px; padding: 5px; text-align: center; border-radius: 4px; color: #000; }
        .booking-header h4 { margin: 2px 0; border-bottom: 1px solid #333; padding-bottom: 2px; }
        .booking-header p { margin: 2px 0; font-weight: bold; font-size: 14px; }

        .client-info { padding: 8px; background: #ebf2f7; border-bottom: 1px solid #ccc; }
        .client-info input { width: 92%; padding: 6px; margin: 3px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }

        .cart-content { flex: 1; overflow-y: auto; padding: 5px; }
        .cart-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; background: #fff; margin-bottom: 4px; border-radius: 5px; }
        .item-main { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .item-note { width: 95%; margin-top: 5px; padding: 4px; border: 1px dashed #bbb; border-radius: 3px; font-size: 12px; color: #555; }
        
        .qty-btns { display: flex; align-items: center; gap: 8px; background: #f0f0f0; padding: 2px 8px; border-radius: 15px; }
        .qty-btns button { background: none; border: none; cursor: pointer; font-weight: bold; color: var(--blue); }

        /* 🟦 المنتجات */
        .main { flex: 1; padding: 15px; overflow-y: auto; }
        .categories { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .cat-btn-wrapper { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .cat-btn { padding: 8px 15px; border: 2px solid var(--accent); background: white; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .cat-btn.active { background: var(--accent); color: white; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .prod-card { background: white; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; border-bottom: 3px solid var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }

        .footer-total { padding: 15px; border-top: 2px solid var(--blue); background: white; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; color: white; font-weight: bold; margin-top: 5px; cursor: pointer; }

        .admin-box { margin-top: 20px; padding: 15px; background: white; border: 1px dashed var(--accent); border-radius: 10px; }
        .del-x { color: red; cursor: pointer; font-weight: bold; position: absolute; top: 5px; left: 5px; display: none; }
        .edit-pen { font-size: 11px; background: #f39c12; color: white; border: none; padding: 2px 6px; border-radius: 4px; display: none; }

        /* 🖨️ حل مشكلة طول الفاتورة والمساحة البيضاء */
        @media print {
            @page { margin: 0; size: auto; } /* إلغاء هوامش الصفحة بالكامل */
            body { background: white; display: block; height: auto; overflow: visible; }
            .main, .no-print, .qty-btns button { display: none !important; }
            .sidebar { width: 100%; height: auto; border: none; position: static; }
            .cart-content { overflow: visible; height: auto; flex: none; }
            .cart-item { border-bottom: 1px solid #000; padding: 5px 0; }
            .item-note { border: none; padding: 0; margin-top: 2px; }
            .footer-total { border-top: 1px solid #000; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h3 style="margin:0">سحايب ديرتي 💙</h3>
        <small>رقم الطلب: <span id="invDisplay">1001</span></small>
    </div>

    <div class="booking-header">
        <h4>فاتورة حجز مؤقت</h4>
        <p>📞 0112020203</p>
    </div>

    <div class="client-info">
        <input id="cPhone" type="tel" placeholder="📱 رقم جوال العميل">
        <input id="cTime" type="text" placeholder="📅 الموعد (نص حر)">
        <input id="cLoc" type="text" placeholder="📍 الموقع / العنوان">
    </div>

    <div id="cartItems" class="cart-content"></div>

    <div class="footer-total">
        <div class="no-print" style="margin-bottom:10px; font-size:13px;">
            <label><input type="radio" name="dType" value="0" checked onchange="updateTotal()"> استلام 🏠</label>
            <label><input type="radio" name="dType" value="1" onchange="toggleDel(true)"> توصيل 🚗</label>
            <input id="delFee" type="number" placeholder="رسوم" style="width:50px; display:none" oninput="updateTotal()">
        </div>
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.2em; color:var(--blue)">
            <span>الإجمالي:</span>
            <span><span id="finalTotal">0.00</span> ر.س</span>
        </div>
        <div id="printNote" style="font-size:11px; margin-top:5px; color:#333;"></div>
        <button class="btn no-print" style="background:var(--blue)" onclick="printOrder()">🖨️ طباعة الفاتورة</button>
        <button class="btn no-print" style="background:#27ae60" onclick="sendWA()">📲 إرسال واتساب</button>
        <button class="btn no-print" style="background:#95a5a6" onclick="clearCart()">🗑️ طلب جديد</button>
    </div>
</div>

<div class="main">
    <div id="catList" class="categories"></div>
    <div id="prodGrid" class="products-grid"></div>

    <div class="admin-box no-print">
        <button id="lockBtn" onclick="toggleLock()" style="background:#f39c12; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">🔓 فتح تعديل القائمة</button>
        <div id="adminPanel" style="display:none; margin-top:15px;">
            <input id="newCatName" placeholder="اسم القسم الجديد"> <button onclick="addNewCat()">+ إضافة قسم</button>
            <hr>
            <select id="catSelect"></select>
            <input id="newPName" placeholder="اسم الصنف"> <input id="newPPrice" type="number" placeholder="السعر">
            <button onclick="addNewProd()">+ إضافة صنف</button>
        </div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('sh_db')) || [{name: "العامة", items: []}];
    let cart = []; let curCat = 0; let isLocked = true;
    let invNum = localStorage.getItem('sh_inv') || 1001;

    function init() { renderCats(); renderProds(); document.getElementById('invDisplay').innerText = invNum; }

    function renderCats() {
        const list = document.getElementById('catList'); const sel = document.getElementById('catSelect');
        list.innerHTML = ''; sel.innerHTML = '';
        db.forEach((c, i) => {
            list.innerHTML += `
                <div class="cat-btn-wrapper">
                    <button class="cat-btn ${i==curCat?'active':''}" onclick="setCat(${i})">${c.name}</button>
                    <button class="edit-pen" onclick="editCat(${i})">✏️ تعديل</button>
                </div>`;
            sel.innerHTML += `<option value="${i}">${c.name}</option>`;
        });
    }

    function renderProds() {
        const grid = document.getElementById('prodGrid'); grid.innerHTML = '';
        db[curCat].items.forEach((p, i) => {
            grid.innerHTML += `
                <div class="prod-card" onclick="addToCart('${p.name}', ${p.price})">
                    <span class="del-x" onclick="event.stopPropagation(); deleteProd(${i})">❌</span>
                    <b>${p.name}</b><br><small>${p.price} ر.س</small>
                </div>`;
        });
        document.querySelectorAll('.del-x, .edit-pen').forEach(el => el.style.display = isLocked ? 'none' : 'inline-block');
    }

    function addToCart(name, price) {
        cart.push({name, price, qty: 1, note: "", id: Date.now()});
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItems'); container.innerHTML = '';
        cart.forEach((item, i) => {
            container.innerHTML += `
                <div class="cart-item">
                    <div class="item-main">
                        <div style="flex:1">
                            <span>${item.name}</span><br>
                            <small style="color:var(--accent)">${item.price} ر.س</small>
                        </div>
                        <div class="qty-btns no-print">
                            <button onclick="changeQty(${i}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button onclick="changeQty(${i}, 1)">+</button>
                        </div>
                    </div>
                    <input class="item-note no-print" placeholder="إضافة ملاحظة..." value="${item.note}" oninput="updateNote(${i}, this.value)">
                    ${item.note ? `<div style="font-size:11px; color:#666; margin-top:2px;">📝 ${item.note}</div>` : ''}
                    ${item.qty > 1 ? `<div style="font-size:11px; font-weight:bold;">العدد: ${item.qty}</div>` : ''}
                </div>`;
        });
        updateTotal();
    }

    function changeQty(i, n) { cart[i].qty += n; if(cart[i].qty <= 0) cart.splice(i,1); renderCart(); }
    function updateNote(i, val) { cart[i].note = val; }
    function updateTotal() {
        let itemsSum = cart.reduce((a, b) => a + (b.price * b.qty), 0);
        let delivery = 0;
        if(document.querySelector('input[name="dType"]:checked').value == "1") {
            delivery = parseFloat(document.getElementById('delFee').value) || 0;
        }
        document.getElementById('finalTotal').innerText = (itemsSum + delivery).toFixed(2);
        let info = `📍 الموقع: ${document.getElementById('cLoc').value} | 📅 الموعد: ${document.getElementById('cTime').value}`;
        if(delivery > 0) info += ` | 🚗 التوصيل: ${delivery} ر.س`;
        document.getElementById('printNote').innerText = info;
    }

    function toggleDel(s) { document.getElementById('delFee').style.display = s?'inline':'none'; updateTotal(); }
    function setCat(i) { curCat = i; renderCats(); renderProds(); }
    function toggleLock() { isLocked = !isLocked; document.getElementById('adminPanel').style.display = isLocked?'none':'block'; document.getElementById('lockBtn').innerText = isLocked?'🔓 فتح تعديل القائمة':'🔒 قفل القائمة'; renderProds(); renderCats(); }
    function addNewCat() { let n=document.getElementById('newCatName').value; if(n){db.push({name:n,items:[]});save();renderCats();}}
    function addNewProd() {
        let c=document.getElementById('catSelect').value, n=document.getElementById('newPName').value, p=document.getElementById('newPPrice').value;
        if(n&&p){db[c].items.push({name:n,price:parseFloat(p)});save();renderProds();}
    }
    function deleteProd(i) { if(confirm("حذف؟")){db[curCat].items.splice(i,1);save();renderProds();}}
    function editCat(i) { let n=prompt("الاسم الجديد للقسم:", db[i].name); if(n){db[i].name=n;save();renderCats();}}
    function save() { localStorage.setItem('sh_db', JSON.stringify(db)); }
    function printOrder() { window.print(); invNum++; localStorage.setItem('sh_inv', invNum); document.getElementById('invDisplay').innerText = invNum; }

    function sendWA() {
        let ph = document.getElementById('cPhone').value; if(!ph) return alert("سجل رقم الجوال!");
        let m = `🧾 *حجز مؤقت - سحايب ديرتي*%0A%0A`;
        cart.forEach(i => m += `• ${i.name} (x${i.qty}) = ${i.price*i.qty} ر.س ${i.note ? '[ ملاحظة: '+i.note+']' : ''}%0A`);
        m += `%0A📅 *الموعد:* ${document.getElementById('cTime').value}%0A📍 *الموقع:* ${document.getElementById('cLoc').value}%0A💰 *الإجمالي: ${document.getElementById('finalTotal').innerText} ر.س*%0A`;
        
        // 📲 إضافة رابط التطبيق والدعوة لتثبيته
        m += `%0A📥 *ندعوك لتثبيت تطبيقنا لطلب أسهل وأسرع:*%0Ahttps://deerty666.github.io/deerty/`;
        
        window.open(`https://wa.me/966${ph}?text=${m}`);
    }

    function clearCart() { if(confirm("بدء طلب جديد؟")){cart=[]; renderCart();}}
    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحايب ديرتي - كاشير احترافي</title>
    
    <!-- دعم التثبيت كتطبيق -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        @media print {
            .no-print, .modal { display: none !important; }
            #printArea { 
                width: 80mm; 
                margin: 0 auto; 
                padding: 6mm; 
                font-size: 13.5px; 
                line-height: 1.5; 
            }
        }
    </style>
</head>
<body>

<div class="app">
    <header>
        <img src="logo.png" alt="شعار" class="logo-header">
        <div>
            <h1>سحايب ديرتي</h1>
            <p>نظام الكاشير الاحترافي</p>
        </div>
        <button onclick="openAdminModal()" class="admin-btn">⚙️ إدارة القائمة</button>
    </header>

    <div class="main-content">
        
        <!-- الجانب الأيسر: الفاتورة والسلة -->
        <div class="left-panel">
    
    <div id="printArea" style="background: white;">
        
        <div class="receipt-header">
            <img src="logo.png" class="logo">
            <h2>سحايب ديرتي</h2>
            <div class="special-box">فاتورة حجز مؤقتة</div>
            <p>رقم المطعم: <strong>0112020203</strong></p>
            <p id="currentDate"></p>
            <hr>
        </div>

        <div id="cart" class="cart"></div>

        <div class="total-fancy">
            <span>الإجمالي النهائي</span>
            <span id="grandTotal">0.00 ر.س</span>
        </div>

    </div> <div class="no-print">
        </div>

</div>

                <button onclick="printReceipt()" class="btn print">🖨️ طباعة 80mm</button>
                <button onclick="sendToWhatsApp()" class="btn whatsapp">📲 واتساب</button>
                <button onclick="clearCart()" class="btn clear">🗑️ فاتورة جديدة</button>
            </div>
        </div>

        <!-- الجانب الأيمن: القائمة (مربعات ملونة) -->
        <div class="right-panel">
            <h3>📋 القائمة</h3>
            <div id="menuContainer"></div>
        </div>
    </div>
</div>

<!-- نافذة الإدارة -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <span onclick="closeAdminModal()" class="close">×</span>
        <h2>⚙️ إدارة القائمة</h2>
        
        <div class="admin-section">
            <h3>إضافة قسم</h3>
            <input id="newCatName" class="input" placeholder="اسم القسم">
            <button onclick="addCategory()" class="btn">إضافة قسم</button>
        </div>

        <div class="admin-section">
            <h3>الأقسام والأصناف</h3>
            <div id="adminCategoriesList"></div>
        </div>

        <div class="admin-section">
            <h3>إضافة صنف</h3>
            <select id="adminCatSelect" class="input"></select>
            <input id="newItemNameAdmin" class="input" placeholder="اسم الصنف">
            <input id="newItemPriceAdmin" type="number" class="input" placeholder="السعر">
            <button onclick="addItemFromAdmin()" class="btn">إضافة الصنف</button>
        </div>
    </div>
</div>

<script src="script.js"></script>

<!-- دعم التثبيت كتطبيق -->
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => {
            console.log('Service Worker registration failed:', err);
        });
    }
</script>
</body>
</html>

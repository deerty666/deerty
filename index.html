<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحايب ديرتي - كاشير فخم</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @media print {
            .no-print, .modal { display: none !important; }
            #printArea { width: 80mm; margin: 0 auto; padding: 6mm; font-size: 13.5px; line-height: 1.5; }
        }
    </style>
</head>
<body>

<div class="app">
    <header>
        <img src="logo.png" alt="شعار" class="logo-header">
        <div>
            <h1>سحايب ديرتي</h1>
            <p>نظام الكاشير الاحترافي</p>
        </div>
        <button onclick="openAdminModal()" class="admin-btn">⚙️ إدارة القائمة</button>
    </header>

    <div class="main-content">
        <div class="pos-area" id="printArea">
            <div class="receipt-header">
                <img src="logo.png" class="logo" alt="شعار">
                <h2>سحايب ديرتي</h2>
                <div class="special-box">فاتورة حجز مواقته</div>
                <p class="restaurant-number">رقم المطعم: <strong>0112020203</strong></p>
                <p id="currentDate"></p>
                <hr>
            </div>

            <!-- خيار التوصيل / الاستلام -->
            <div class="delivery-type no-print">
                <button onclick="setOrderType('takeaway')" id="btn-takeaway" class="type-btn active">🏠 استلام</button>
                <button onclick="setOrderType('delivery')" id="btn-delivery" class="type-btn">🚗 توصيل</button>
            </div>

            <!-- رسوم التوصيل -->
            <div id="delivery-fee-section" class="delivery-fee no-print" style="display: none;">
                <label>رسوم التوصيل:</label>
                <input id="deliveryFee" type="number" value="15" onchange="updateTotal()" style="width: 100px;">
                <span>ريال</span>
            </div>

            <div class="customer no-print">
                <input id="custName" placeholder="اسم العميل" class="input">
                <input id="custPhone" placeholder="جوال العميل (050...)" class="input">
                <input id="custAddress" placeholder="العنوان / الموقع" class="input">
                <input id="custTime" type="datetime-local" class="input">
            </div>

            <div id="cart" class="cart"></div>

            <div class="total-fancy">
                <span>الإجمالي النهائي</span>
                <span id="grandTotal">0.00 ريال</span>
            </div>

            <div class="actions no-print">
                <button onclick="printReceipt()" class="btn print">🖨️ طباعة</button>
                <button onclick="sendToWhatsApp()" class="btn whatsapp">📲 واتساب</button>
                <button onclick="clearCart()" class="btn clear">فاتورة جديدة</button>
            </div>
        </div>

        <!-- قائمة الأصناف -->
        <div class="menu-area no-print">
            <h3>القائمة</h3>
            <div id="menuContainer"></div>
        </div>
    </div>
</div>

<!-- نافذة الإدارة -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <span onclick="closeAdminModal()" class="close">×</span>
        <h2>⚙️ إدارة القائمة والأصناف</h2>
        <!-- باقي محتوى الإدارة يأتي في script.js -->
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

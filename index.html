<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحايب ديرتي POS - الاحترافي</title>
    <link rel="manifest" href="data:application/manifest+json,{"name":"Sahaib POS","short_name":"POS","start_url":".","display":"standalone","background_color":"#2c3e50","theme_color":"#2c3e50"}">
    
    <style>
        :root {
            --primary-blue: #2c3e50;
            --accent-blue: #3498db;
            --light-blue: #ecf0f1;
            --success-green: #27ae60;
            --danger-red: #e74c3c;
            --text-dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #f0f3f6;
            overflow: hidden;
        }

        /* 🟦 تنسيق اللوحة الجانبية (الفاتورة) */
        .sidebar {
            width: 380px;
            background: white;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            box-shadow: -2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            background: var(--primary-blue);
            color: white;
            text-align: center;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            background: #fff;
            margin-bottom: 5px;
            border-radius: 8px;
        }

        .item-info { flex-grow: 1; }
        .item-name { font-weight: bold; color: var(--text-dark); }
        .item-price { color: var(--accent-blue); font-size: 0.9em; }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--light-blue);
            padding: 5px 10px;
            border-radius: 20px;
        }

        /* 🟦 منطقة المنتجات */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .cat-btn {
            padding: 12px 25px;
            background: white;
            border: 2px solid var(--accent-blue);
            color: var(--accent-blue);
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
            transition: 0.3s;
        }

        .cat-btn.active {
            background: var(--accent-blue);
            color: white;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border-bottom: 4px solid var(--accent-blue);
        }

        .product-card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .product-card:active { transform: scale(0.95); }

        /* 🖨️ التنسيق عند الطباعة */
        @media print {
            .main-content, .no-print, .qty-controls button { display: none !important; }
            body { background: white; padding: 0; }
            .sidebar { width: 100%; border: none; box-shadow: none; }
            .cart-item { border-bottom: 1px dotted #000; }
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: 0.2s;
        }
        .btn-print { background: var(--primary-blue); }
        .btn-whatsapp { background: var(--success-green); }
        .btn-clear { background: var(--danger-red); }

        .total-section {
            padding: 20px;
            background: #f8f9fa;
            border-top: 2px solid var(--primary-blue);
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h2 style="margin:0">سحايب ديرتي</h2>
        <small>رقم الفاتورة: <span id="invNum">1001</span></small>
    </div>
    
    <div class="no-print" style="padding:10px; border-bottom:1px solid #eee;">
        <input id="custName" placeholder="اسم العميل / الموعد" style="width:90%; padding:8px; margin-bottom:5px; border:1px solid #ddd; border-radius:5px;">
        <input id="custPhone" placeholder="رقم الجوال" style="width:90%; padding:8px; border:1px solid #ddd; border-radius:5px;">
    </div>

    <div id="cartItems" class="cart-items">
        </div>

    <div class="total-section">
        <div style="display:flex; justify-content:space-between; font-size:1.4em; font-weight:bold; color:var(--primary-blue); margin-bottom:15px;">
            <span>الإجمالي:</span>
            <span><span id="totalVal">0.00</span> ر.س</span>
        </div>
        
        <div class="no-print" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button class="btn btn-print" onclick="printInvoice()">🖨️ طباعة</button>
            <button class="btn btn-whatsapp" onclick="sendWhatsApp()">📲 واتساب</button>
            <button class="btn btn-clear" style="grid-column: span 2;" onclick="clearCart()">🗑️ فاتورة جديدة</button>
        </div>
    </div>
</div>

<div class="main-content">
    <div id="categories" class="categories">
        </div>
    <div id="productsGrid" class="products-grid">
        </div>
    
    <hr style="margin:40px 0; border:0; border-top:1px solid #ddd;">
    
    <div class="no-print" style="background:#fff; padding:20px; border-radius:12px; border:1px dashed var(--accent-blue);">
        <h3>⚙️ إدارة القائمة</h3>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <input id="newCatInput" placeholder="اسم القسم الجديد">
            <button class="btn btn-print" onclick="addNewCat()">+ إضافة قسم</button>
            |
            <select id="catSelect"></select>
            <input id="newItemName" placeholder="اسم الصنف">
            <input id="newItemPrice" type="number" placeholder="السعر" style="width:80px">
            <button class="btn btn-print" onclick="addNewItem()">+ إضافة صنف</button>
        </div>
    </div>
</div>

<script>
    // بيانات النظام
    let menu = JSON.parse(localStorage.getItem('menu_db')) || [
        {name: "الرئيسية", items: [{name: "وجبة دجاج", price: 25}, {name: "وجبة لحم", price: 35}]}
    ];
    let cart = [];
    let activeCatIndex = 0;
    let inv = localStorage.getItem('inv_num') || 1001;

    // تشغيل النظام
    function init() {
        renderCats();
        renderProducts();
        updateInvDisplay();
    }

    function renderCats() {
        const catDiv = document.getElementById('categories');
        const select = document.getElementById('catSelect');
        catDiv.innerHTML = ''; select.innerHTML = '';
        
        menu.forEach((cat, index) => {
            catDiv.innerHTML += `<button class="cat-btn ${index === activeCatIndex ? 'active' : ''}" onclick="changeCat(${index})">${cat.name}</button>`;
            select.innerHTML += `<option value="${index}">${cat.name}</option>`;
        });
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';
        const items = menu[activeCatIndex].items;
        
        items.forEach((item, index) => {
            grid.innerHTML += `
                <div class="product-card" onclick="addToCart('${item.name}', ${item.price})">
                    <div style="font-weight:bold; font-size:1.1em; color:var(--primary-blue)">${item.name}</div>
                    <div style="color:var(--accent-blue); margin-top:5px;">${item.price} ر.س</div>
                </div>
            `;
        });
    }

    function addToCart(name, price) {
        const existing = cart.find(i => i.name === name);
        if(existing) {
            existing.qty++;
        } else {
            cart.push({name, price, qty: 1});
        }
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItems');
        container.innerHTML = '';
        let total = 0;

        cart.forEach((item, index) => {
            total += item.price * item.qty;
            container.innerHTML += `
                <div class="cart-item">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">${item.price} ر.س</div>
                    </div>
                    <div class="qty-controls">
                        <button onclick="updateQty(${index}, -1)" style="border:none; cursor:pointer;">-</button>
                        <span>${item.qty}</span>
                        <button onclick="updateQty(${index}, 1)" style="border:none; cursor:pointer;">+</button>
                    </div>
                </div>
            `;
        });
        document.getElementById('totalVal').innerText = total.toFixed(2);
    }

    function updateQty(index, change) {
        cart[index].qty += change;
        if(cart[index].qty <= 0) cart.splice(index, 1);
        renderCart();
    }

    function changeCat(index) {
        activeCatIndex = index;
        renderCats();
        renderProducts();
    }

    // إدارة القائمة
    function addNewCat() {
        const name = document.getElementById('newCatInput').value;
        if(name) { menu.push({name, items: []}); saveMenu(); init(); }
    }

    function addNewItem() {
        const catIdx = document.getElementById('catSelect').value;
        const name = document.getElementById('newItemName').value;
        const price = parseFloat(document.getElementById('newItemPrice').value);
        if(name && price) { menu[catIdx].items.push({name, price}); saveMenu(); renderProducts(); }
    }

    function saveMenu() { localStorage.setItem('menu_db', JSON.stringify(menu)); }

    // الطباعة والواتساب
    function printInvoice() {
        window.print();
        inv++;
        localStorage.setItem('inv_num', inv);
        updateInvDisplay();
    }

    function updateInvDisplay() { document.getElementById('invNum').innerText = inv; }

    function sendWhatsApp() {
        let phone = document.getElementById('custPhone').value;
        if(!phone) return alert("سجل رقم الجوال أولاً");
        let msg = `🧾 *فاتورة سحايب ديرتي*%0A`;
        cart.forEach(i => msg += `• ${i.name} (${i.qty}) = ${i.price * i.qty}ر.س%0A`);
        msg += `💰 *الإجمالي: ${document.getElementById('totalVal').innerText} ريال*`;
        window.open(`https://wa.me/966${phone.startsWith('0') ? phone.substring(1) : phone}?text=${msg}`);
    }

    function clearCart() { cart = []; renderCart(); }

    // 📡 كود العمل بدون إنترنت (Service Worker)
    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', e => {
                e.waitUntil(caches.open('pwa-v1').then(c => c.addAll(['/'])));
            });
            self.addEventListener('fetch', e => {
                e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
            });
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blob));
    }

    init();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحايب ديرتي - كاشير</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 10px; }
        .container { display: flex; gap: 15px; max-width: 1200px; margin: auto; }
        .sidebar { width: 320px; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .main { flex: 1; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .full-width { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { padding: 10px; margin: 5px 0; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn-green { background: #28a745; color: white; }
        .btn-blue { background: #007bff; color: white; }
        .cart-item { padding: 10px; border-bottom: 1px solid #eee; margin-bottom: 8px; }
        @media print {
            .no-print { display: none !important; }
            #printArea { width: 80mm; margin: 0 auto; padding: 5mm; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- الجانب الأيسر - إدارة القائمة -->
    <div class="sidebar no-print">
        <h2>📋 إدارة القائمة</h2>
        
        <h3>إضافة قسم جديد</h3>
        <input id="newCat" class="full-width" placeholder="اسم القسم الجديد (مثال: مشروبات)">
        <button onclick="addCategory()" class="btn-green full-width">➕ إضافة القسم</button>

        <hr>
        <h3>إضافة صنف</h3>
        <select id="catSelect" class="full-width"></select>
        <input id="newItemName" class="full-width" placeholder="اسم الصنف">
        <input id="newItemPrice" type="number" class="full-width" placeholder="السعر">
        <button onclick="addMenuItem()" class="btn-blue full-width">➕ إضافة الصنف</button>

        <hr>
        <div id="menuDisplay"></div>
    </div>

    <!-- منطقة الفاتورة -->
    <div class="main" id="printArea">
        <div style="text-align:center; margin-bottom:20px;">
            <img src="logo.png" alt="شعار" style="width:140px;">
            <h1>سحايب ديرتي</h1>
            <div style="border:3px solid black; padding:12px; font-size:18px; font-weight:bold; margin:15px 0;">
                فاتورة حجز مواقته
            </div>
            <p><strong>رقم المطعم: 0112020203</strong></p>
            <p id="currentDate"></p>
        </div>

        <div class="no-print">
            <input id="custName" class="full-width" placeholder="اسم العميل">
            <input id="custPhone" class="full-width" placeholder="جوال العميل 966...">
            <input id="custAddress" class="full-width" placeholder="العنوان">
            <input id="custTime" type="datetime-local" class="full-width">
        </div>

        <div id="cartItems" style="min-height:200px;"></div>

        <div style="font-size:20px; text-align:right; margin:20px 0; font-weight:bold;">
            الإجمالي: <span id="grandTotal">0.00</span> ريال
        </div>

        <div class="no-print" style="display:flex; gap:10px;">
            <button onclick="printReceipt()" style="flex:1; padding:15px; background:#28a745; color:white;">🖨️ طباعة</button>
            <button onclick="sendToWhatsApp()" style="flex:1; padding:15px; background:#25D366; color:white;">📲 واتساب</button>
            <button onclick="clearCart()" style="flex:1; padding:15px; background:#dc3545; color:white;">جديد</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

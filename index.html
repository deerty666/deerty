<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحايب ديرتي - كاشير</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            #printArea { width: 80mm; margin: 0 auto; padding: 6mm; font-size: 13.5px; line-height: 1.5; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- الجانب الأيسر - إدارة القائمة -->
    <div class="sidebar no-print">
        <div class="header">
            <h1>📋 سحايب ديرتي</h1>
            <p>نظام الكاشير</p>
        </div>

        <h3>إضافة قسم جديد</h3>
        <input id="newCat" class="input" placeholder="اسم القسم الجديد">
        <button onclick="addCategory()" class="btn btn-green">➕ إضافة القسم</button>

        <hr>
        <h3>إضافة صنف</h3>
        <select id="catSelect" class="input"></select>
        <input id="newItemName" class="input" placeholder="اسم الصنف">
        <input id="newItemPrice" type="number" class="input" placeholder="السعر (ريال)">
        <button onclick="addMenuItem()" class="btn btn-blue">➕ إضافة الصنف</button>

        <hr>
        <h3>القائمة</h3>
        <div id="menuDisplay"></div>
    </div>

    <!-- منطقة الفاتورة -->
    <div class="main" id="printArea">
        <div class="receipt-header">
            <img src="logo.png" alt="شعار" class="logo">
            <h1>سحايب ديرتي</h1>
            <div class="special-box">فاتورة حجز مواقته</div>
            <p class="restaurant-info"><strong>رقم المطعم: 0112020203</strong></p>
            <p id="currentDate"></p>
            <hr>
        </div>

        <div class="customer-info no-print">
            <input id="custName" class="input" placeholder="اسم العميل">
            <input id="custPhone" class="input" placeholder="جوال العميل (0501234567)">
            <input id="custAddress" class="input" placeholder="العنوان / الموقع">
            <input id="custTime" type="datetime-local" class="input">
        </div>

        <div id="cartItems"></div>

        <div class="total-box">
            <span>الإجمالي النهائي</span>
            <span id="grandTotal" class="total-amount">0.00 ريال</span>
        </div>

        <div class="actions no-print">
            <button onclick="printReceipt()" class="btn btn-print">🖨️ طباعة 80mm</button>
            <button onclick="sendToWhatsApp()" class="btn btn-whatsapp">📲 إرسال عبر واتساب</button>
            <button onclick="clearCart()" class="btn btn-clear">🗑️ فاتورة جديدة</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

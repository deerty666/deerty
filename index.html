<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحايب ديرتي - نظام الفواتير المطور</title>
    <style>
        :root { --blue: #2c3e50; --accent: #3498db; --black: #000; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f7f9; overflow: hidden; }

        /* 🛒 السلة */
        .sidebar { width: 380px; background: white; border-left: 2px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-header { padding: 10px; background: var(--blue); color: white; text-align: center; }
        
        /* 🖼️ شعار المطعم - تأكد أن اسم الصورة في مجلدك هو logo.jpg */
        .logo-container img { width: 100px; height: auto; margin-bottom: 5px; border-radius: 8px; }

        .booking-header { background: #f8f9fa; border: 2px solid #333; margin: 5px; padding: 5px; text-align: center; border-radius: 4px; color: #000; }
        .booking-header h4 { margin: 2px 0; border-bottom: 1px solid #333; padding-bottom: 2px; }

        .client-info { padding: 8px; background: #ebf2f7; border-bottom: 1px solid #ccc; }
        .client-info input { width: 92%; padding: 6px; margin: 3px 0; border: 1px solid #ccc; border-radius: 4px; }

        .cart-content { flex: 1; overflow-y: auto; padding: 5px; }
        .cart-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; background: #fff; margin-bottom: 4px; }
        .item-main { display: flex; justify-content: space-between; font-weight: bold; }
        
        .item-note { width: 95%; margin-top: 5px; padding: 4px; border: 1px dashed #bbb; font-size: 12px; }
        .item-note-print { display: none; } /* يظهر في الطباعة فقط */

        .footer-total { padding: 15px; border-top: 2px solid var(--blue); background: white; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; color: white; font-weight: bold; margin-top: 5px; cursor: pointer; }

        /* 🟦 منطقة المنتجات */
        .main { flex: 1; padding: 15px; overflow-y: auto; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .prod-card { background: white; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; border-bottom: 3px solid var(--accent); }

        /* 🖨️ إعدادات الطباعة (توسيط ومنع القص) */
        @media print {
            @page { margin: 0; size: auto; }
            body { background: white; color: #000 !important; }
            .main, .no-print { display: none !important; }
            
            /* 📏 توسيط الفاتورة لمنع القص الجانبي */
            .sidebar { 
                width: 85% !important; 
                margin: 0 auto !important; 
                border: none !important; 
                text-align: center !important;
            }
            
            .cart-item { border-bottom: 1px solid #000; padding: 10px 0; text-align: right; }
            .item-note-print { display: block !important; font-weight: bold; font-size: 13px; margin-top: 5px; color: #000; }
            .footer-total { border-top: 2px solid #000; margin-top: 15px; }
            #finalTotal { font-size: 1.5em; font-weight: bold; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo" onerror="this.src='https://via.placeholder.com/100?text=Logo'">
        </div>
        <h3 style="margin:0">سحايب ديرتي 💙</h3>
        <small>رقم الطلب: <span id="invDisplay">1008</span></small>
    </div>

    <div class="booking-header">
        <h4>فاتورة حجز مؤقت</h4>
        <p>📞 0112020203</p>
    </div>

    <div class="client-info">
        <input id="cPhone" type="tel" placeholder="📱 رقم جوال العميل">
        <input id="cTime" type="text" placeholder="📅 الموعد (مثلاً: اليوم بعد العصر)">
        <input id="cLoc" type="text" placeholder="📍 الموقع / العنوان">
    </div>

    <div id="cartItems" class="cart-content"></div>

    <div class="footer-total">
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.3em;">
            <span>الإجمالي:</span>
            <span><span id="finalTotal">0.00</span> ر.س</span>
        </div>
        <button class="btn no-print" style="background:var(--blue)" onclick="printOrder()">🖨️ طباعة الفاتورة</button>
        <button class="btn no-print" style="background:#27ae60" onclick="sendWA()">📲 إرسال واتساب شامل</button>
        <button class="btn no-print" style="background:#95a5a6" onclick="clearCart()">🗑️ طلب جديد</button>
    </div>
</div>

<div class="main">
    <div id="prodGrid" class="products-grid"></div>
</div>

<script>
    let cart = [];
    // بيانات تجريبية (يمكنك إضافة منتجاتك هنا أو عبر لوحة الإدارة)
    let products = [{name: "صنف تجريبي", price: 10}, {name: "نص شو", price: 23}];
    let invNum = localStorage.getItem('sh_inv') || 1008;

    function init() { 
        renderProds(); 
        document.getElementById('invDisplay').innerText = invNum; 
    }

    function renderProds() {
        const grid = document.getElementById('prodGrid');
        products.forEach((p, i) => {
            grid.innerHTML += `<div class="prod-card" onclick="addToCart('${p.name}', ${p.price})"><b>${p.name}</b><br>${p.price} ر.س</div>`;
        });
    }

    function addToCart(name, price) {
        cart.push({name, price, qty: 1, note: ""});
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItems'); container.innerHTML = '';
        cart.forEach((item, i) => {
            container.innerHTML += `
                <div class="cart-item">
                    <div class="item-main">
                        <span>${item.name} (x${item.qty})</span>
                        <span>${item.price * item.qty} ر.س</span>
                    </div>
                    <input class="item-note no-print" placeholder="أضف ملاحظة..." value="${item.note}" oninput="cart[${i}].note=this.value; updateTotal()">
                    <div class="item-note-print">${item.note ? '📝 ملاحظة: ' + item.note : ''}</div>
                </div>`;
        });
        updateTotal();
    }

    function updateTotal() {
        let total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
        document.getElementById('finalTotal').innerText = total.toFixed(2);
    }

    function printOrder() { 
        window.print(); 
        invNum++; 
        localStorage.setItem('sh_inv', invNum); 
        document.getElementById('invDisplay').innerText = invNum; 
    }

    // 📲 وظيفة الواتساب المطورة لتشمل كافة التفاصيل
    function sendWA() {
        let ph = document.getElementById('cPhone').value;
        if(!ph) return alert("يرجى إدخال رقم الجوال أولاً!");

        let message = `🧾 *فاتورة حجز - سحايب ديرتي*%0A`;
        message += `🔢 *رقم الطلب:* ${invNum}%0A`;
        message += `--------------------------%0A`;
        
        cart.forEach(item => {
            message += `🔹 *${item.name}*%0A`;
            message += `    الكمية: ${item.qty} | السعر: ${item.price * item.qty} ر.س%0A`;
            if(item.note) message += `    📌 ملاحظة: ${item.note}%0A`;
        });

        message += `--------------------------%0A`;
        message += `📅 *الموعد:* ${document.getElementById('cTime').value || 'غير محدد'}%0A`;
        message += `📍 *الموقع:* ${document.getElementById('cLoc').value || 'غير محدد'}%0A`;
        message += `💰 *الإجمالي النهائي: ${document.getElementById('finalTotal').innerText} ر.س*%0A%0A`;
        message += `📱 *للطب السريع عبر تطبيقنا:*%0Ahttps://deerty666.github.io/deerty/`;

        window.open(`https://wa.me/966${ph}?text=${message}`);
    }

    function clearCart() { if(confirm("بدء طلب جديد؟")) { cart = []; renderCart(); } }
    init();
</script>
</body>
</html>

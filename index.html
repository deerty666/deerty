<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحايب ديرتي - POS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar" id="printArea">
            <div class="invoice-box">
                <h2>سحايب ديرتي 💙</h2>
                <p>فاتورة مبيعات</p>
                <hr>
                <div id="cartItems">
                    </div>
                <hr>
                <div class="total-section">
                    <h3>الإجمالي: <span id="totalDisplay">0.00</span> ر.س</h3>
                </div>
                <button class="no-print print-btn" onclick="window.print()">طباعة الفاتورة 🖨️</button>
            </div>
        </aside>

        <main class="main-content no-print">
            <nav id="categoriesNav" class="tabs-nav">
                </nav>
            
            <section id="productsGrid" class="products-container">
                </section>

            <footer id="adminSection">
                <h3>🛠️ لوحة الإدارة (المستودع)</h3>
                
                <div class="admin-flex">
                    <div class="admin-card">
                        <h4>📂 إدارة الأقسام</h4>
                        <input type="text" id="catInput" placeholder="اسم القسم...">
                        <button onclick="addCategory()">+ إضافة</button>
                        <div id="categoriesManager" class="scroll-list"></div>
                    </div>

                    <div class="admin-card">
                        <h4>🍎 إضافة أصناف</h4>
                        <select id="prodCatSelect"></select>
                        <input type="text" id="prodNameInput" placeholder="اسم الصنف">
                        <input type="number" id="prodPriceInput" placeholder="السعر">
                        <button onclick="addProduct()">+ إضافة صنف</button>
                    </div>
                </div>
            </footer>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>

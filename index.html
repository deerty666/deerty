<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سحايب ديرتي POS - النسخة المطورة</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
    :root {
        --primary: #1e40af;
        --accent: #f59e0b;
        --success: #10b981;
        --danger: #ef4444;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; margin: 0; padding: 10px; direction: rtl; }
    .container { display: flex; gap: 15px; flex-wrap: wrap; }
    .panel { background: white; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); padding: 20px; flex: 1; min-width: 350px; }
    
    /* الأزرار والتنسيقات */
    .cat-btn { background: var(--primary); color: white; border: none; padding: 12px 15px; margin: 5px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    .item-btn { background: #fff; border: 2px solid #e2e8f0; padding: 15px; margin: 5px; border-radius: 12px; cursor: pointer; min-width: 120px; transition: 0.3s; }
    .item-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
    
    .admin-controls { font-size: 0.8em; margin-top: 5px; display: flex; gap: 5px; justify-content: center; }
    .edit-btn { background: #cbd5e1; color: #1e293b; padding: 4px 8px; border-radius: 5px; cursor: pointer; }
    .del-btn { background: #fee2e2; color: #b91c1c; padding: 4px 8px; border-radius: 5px; cursor: pointer; }

    .cart-item { background: #f8fafc; padding: 12px; margin: 8px 0; border-radius: 12px; border-right: 5px solid var(--accent); position: relative; }
    input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 10px; border: 1px solid #cbd5e1; box-sizing: border-box; }

    /* تنسيق الطباعة الحرارية */
    @media print {
        .no-print { display: none !important; }
        body { background: white; padding: 0; }
        .panel { box-shadow: none; border: none; width: 100%; padding: 0; }
        #printArea { width: 80mm; margin: 0 auto; font-size: 12pt; }
        .cart-item { border: none; border-bottom: 1px dashed #ccc; padding: 5px 0; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="panel no-print">
        <h3 style="text-align:center; color:var(--primary);">إدارة القائمة 📋</h3>
        
        <div id="cats" style="text-align:center;"></div>
        <hr>
        <div id="items" style="display:flex; flex-wrap:wrap; justify-content:center;"></div>

        <div style="background:#f8fafc; padding:15px; border-radius:15px; margin-top:20px;">
            <h4>إضافة / تعديل</h4>
            <input id="catInput" placeholder="اسم القسم">
            <button onclick="addOrUpdateCat()" id="catBtn" style="background:var(--primary); color:white; width:100%; padding:10px; border-radius:10px; cursor:pointer; border:none;">➕ إضافة/تحديث قسم</button>
            
            <hr>
            <select id="catSelect"></select>
            <input id="itemName" placeholder="اسم الصنف">
            <input id="itemPrice" type="number" placeholder="السعر">
            <button onclick="addOrUpdateItem()" id="itemBtn" style="background:var(--success); color:white; width:100%; padding:10px; border-radius:10px; cursor:pointer; border:none;">➕ إضافة/تحديث صنف</button>
        </div>
    </div>

    <div class="panel" id="printArea">
        <div style="text-align:center;">
            <h2 style="margin:5px 0; color:var(--primary);">سحايب ديرتي ☁️</h2>
            <p style="font-size:0.9em;">فاتورة ضريبية مبسطة</p>
            <div style="background:#eee; padding:5px; border-radius:20px; display:inline-block; min-width:120px;">
                رقم: <strong id="invNum">0</strong>
            </div>
        </div>

        <div class="no-print" style="margin-top:15px;">
            <input id="cName" placeholder="اسم العميل">
            <input id="cPhone" placeholder="رقم الجوال (05xxxxxxx)">
            <div style="border:1px solid #ddd; padding:10px; border-radius:10px;">
                <label><input type="radio" name="dType" checked onclick="toggleDelivery(false)"> استلام من الفرع</label><br>
                <label><input type="radio" name="dType" id="isDelivery" onclick="toggleDelivery(true)"> توصيل للموقع</label>
                <div id="deliverySection" style="display:none; margin-top:5px;">
                    <input id="deliveryFee" type="number" placeholder="رسوم التوصيل" value="0" oninput="updateCartUI()">
                </div>
            </div>
        </div>

        <div id="cartList" style="margin-top:15px;"></div>

        <div style="border-top:2px solid #333; margin-top:15px; padding-top:10px;">
            <div style="display:flex; justify-content:space-between; font-size:1.2em; font-weight:bold;">
                <span>الإجمالي النهائي:</span>
                <span><span id="totalDisplay">0.00</span> ر.س</span>
            </div>
        </div>

        <div id="qrcode" style="display:flex; justify-content:center; margin:15px 0;"></div>

        <div class="no-print" style="display:flex; gap:5px; margin-top:15px;">
            <button onclick="printInv()" style="background:var(--primary); color:white; flex:2; padding:12px; border-radius:10px; border:none; cursor:pointer;">🖨️ طباعة</button>
            <button onclick="sendWhatsApp()" style="background:var(--success); color:white; flex:2; padding:12px; border-radius:10px; border:none; cursor:pointer;">📲 واتساب</button>
            <button onclick="newInvoice()" style="background:#64748b; color:white; flex:1; padding:12px; border-radius:10px; border:none; cursor:pointer;">جديد</button>
        </div>
    </div>
</div>

<script>
// --- البيانات الأساسية ---
let menu = JSON.parse(localStorage.getItem("pos_menu")) || [
    { name: "قهوة", items: [{name: "سبانش لاتيه", price: 18}, {name: "فلات وايت", price: 15}] },
    { name: "حلى", items: [{name: "كريب", price: 22}, {name: "وافل", price: 20}] }
];
let cart = [];
let invoiceID = parseInt(localStorage.getItem("pos_inv_id")) || 1001;
let activeCatIndex = 0;
let editingItemIndex = -1;

// --- وظائف الإدارة (تعديل وحذف) ---
function renderMenuAdmin() {
    const catDiv = document.getElementById("cats");
    const select = document.getElementById("catSelect");
    catDiv.innerHTML = "";
    select.innerHTML = "";

    menu.forEach((cat, i) => {
        catDiv.innerHTML += `
            <div style="display:inline-block; margin:5px;">
                <button class="cat-btn" onclick="selectCat(${i})">${cat.name}</button>
                <div class="admin-controls">
                    <span class="edit-btn" onclick="editCat(${i})">✏️</span>
                    <span class="del-btn" onclick="deleteCat(${i})">🗑️</span>
                </div>
            </div>`;
        select.innerHTML += `<option value="${i}">${cat.name}</option>`;
    });
    renderItems();
}

function renderItems() {
    const itemDiv = document.getElementById("items");
    itemDiv.innerHTML = "";
    if(!menu[activeCatIndex]) return;

    menu[activeCatIndex].items.forEach((item, i) => {
        itemDiv.innerHTML += `
            <div style="text-align:center;">
                <button class="item-btn" onclick="addToCart('${item.name}', ${item.price})">
                    <strong>${item.name}</strong><br>${item.price} ر.س
                </button>
                <div class="admin-controls">
                    <span class="edit-btn" onclick="prepareEditItem(${i})">✏️</span>
                    <span class="del-btn" onclick="deleteItem(${i})">🗑️</span>
                </div>
            </div>`;
    });
}

function editCat(i) {
    let newName = prompt("تعديل اسم القسم:", menu[i].name);
    if(newName) { menu[i].name = newName; saveMenu(); }
}

function deleteCat(i) {
    if(confirm("هل تريد حذف القسم وكل محتوياته؟")) { menu.splice(i, 1); saveMenu(); }
}

function prepareEditItem(i) {
    editingItemIndex = i;
    const item = menu[activeCatIndex].items[i];
    document.getElementById("itemName").value = item.name;
    document.getElementById("itemPrice").value = item.price;
    document.getElementById("itemBtn").innerText = "🔄 تحديث الصنف";
}

function deleteItem(i) {
    if(confirm("حذف هذا الصنف؟")) { menu[activeCatIndex].items.splice(i, 1); saveMenu(); }
}

function addOrUpdateCat() {
    const name = document.getElementById("catInput").value.trim();
    if(name) {
        menu.push({name: name, items: []});
        document.getElementById("catInput").value = "";
        saveMenu();
    }
}

function addOrUpdateItem() {
    const catIdx = document.getElementById("catSelect").value;
    const name = document.getElementById("itemName").value.trim();
    const price = parseFloat(document.getElementById("itemPrice").value);

    if(name && price) {
        if(editingItemIndex > -1) {
            menu[catIdx].items[editingItemIndex] = {name, price};
            editingItemIndex = -1;
            document.getElementById("itemBtn").innerText = "➕ إضافة صنف";
        } else {
            menu[catIdx].items.push({name, price});
        }
        document.getElementById("itemName").value = "";
        document.getElementById("itemPrice").value = "";
        saveMenu();
    }
}

// --- وظائف السلة والفاتورة ---
function addToCart(name, price) {
    let exist = cart.find(it => it.name === name);
    if(exist) exist.qty++;
    else cart.push({name, price, qty: 1});
    updateCartUI();
}

function updateCartUI() {
    const list = document.getElementById("cartList");
    list.innerHTML = "";
    let subtotal = 0;

    cart.forEach((it, i) => {
        let total = it.price * it.qty;
        subtotal += total;
        list.innerHTML += `
            <div class="cart-item">
                <div style="display:flex; justify-content:space-between;">
                    <strong>${it.name}</strong>
                    <span>${total.toFixed(2)} ر.س</span>
                </div>
                <div class="no-print" style="margin-top:5px;">
                    <button onclick="changeQty(${i}, 1)">+</button>
                    <span> ${it.qty} </span>
                    <button onclick="changeQty(${i}, -1)">-</button>
                    <button onclick="removeItem(${i})" style="color:red; margin-right:10px;">حذف</button>
                </div>
            </div>`;
    });

    if(document.getElementById("isDelivery").checked) {
        subtotal += parseFloat(document.getElementById("deliveryFee").value) || 0;
    }

    document.getElementById("totalDisplay").innerText = subtotal.toFixed(2);
    genQR(subtotal);
}

// --- الرسائل والطباعة ---
function sendWhatsApp() {
    let phone = document.getElementById("cPhone").value.trim();
    let name = document.getElementById("cName").value.trim() || "عميلنا العزيز";
    if(!phone) return alert("يرجى إدخال رقم الجوال");
    if(phone.startsWith("0")) phone = "966" + phone.substring(1);

    let msg = `*سحايب ديرتي* ☁️%0A`;
    msg += `--------------------------%0A`;
    msg += `*العميل:* ${name}%0A`;
    msg += `*الفاتورة:* #${invoiceID}%0A`;
    msg += `--------------------------%0A`;
    cart.forEach(it => {
        msg += `• *${it.name}*%0A  ${it.qty} × ${it.price} = ${(it.qty*it.price).toFixed(2)} ر.س%0A`;
    });
    
    if(document.getElementById("isDelivery").checked) {
        msg += `*التوصيل:* ${document.getElementById("deliveryFee").value} ر.س%0A`;
    }
    
    msg += `--------------------------%0A`;
    msg += `*الإجمالي: ${document.getElementById("totalDisplay").innerText} ر.س*%0A`;
    msg += `شكراً لزيارتكم 💙`;

    window.open(`https://wa.me/${phone}?text=${msg}`);
}

// --- وظائف مساعدة ---
function selectCat(i) { activeCatIndex = i; renderItems(); }
function saveMenu() { localStorage.setItem("pos_menu", JSON.stringify(menu)); renderMenuAdmin(); }
function changeQty(i, delta) { cart[i].qty += delta; if(cart[i].qty < 1) cart.splice(i, 1); updateCartUI(); }
function removeItem(i) { cart.splice(i, 1); updateCartUI(); }
function toggleDelivery(s) { document.getElementById("deliverySection").style.display = s ? 'block' : 'none'; updateCartUI(); }
function printInv() { window.print(); invoiceID++; localStorage.setItem("pos_inv_id", invoiceID); init(); }
function newInvoice() { if(confirm("بدء فاتورة جديدة؟")) { cart = []; document.getElementById("cName").value=""; document.getElementById("cPhone").value=""; updateCartUI(); } }
function genQR(total) {
    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), { text: `Sahaib Derty - Total: ${total} SAR`, width: 100, height: 100 });
}

function init() {
    document.getElementById("invNum").innerText = invoiceID;
    renderMenuAdmin();
    updateCartUI();
}

init();
</script>
</body>
</html>

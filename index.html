<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحايب ديرتي - النظام الكامل</title>
    <style>
        :root { --blue: #2c3e50; --accent: #3498db; --black: #000; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f7f9; overflow: hidden; }

        /* 🛒 السلة الجانبية */
        .sidebar { width: 380px; background: white; border-left: 2px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-header { padding: 10px; background: var(--blue); color: white; text-align: center; }
        .logo-container img { width: 90px; height: auto; margin-bottom: 5px; border-radius: 8px; }

        .booking-header { background: #f8f9fa; border: 2px solid #333; margin: 5px; padding: 5px; text-align: center; border-radius: 4px; color: #000; }
        .client-info { padding: 8px; background: #ebf2f7; border-bottom: 1px solid #ccc; }
        .client-info input { width: 92%; padding: 6px; margin: 3px 0; border: 1px solid #ccc; border-radius: 4px; }

        .cart-content { flex: 1; overflow-y: auto; padding: 5px; }
        .cart-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; background: #fff; margin-bottom: 4px; }
        .item-main { display: flex; justify-content: space-between; font-weight: bold; }
        .item-note-print { display: none; }

        .footer-total { padding: 15px; border-top: 2px solid var(--blue); background: white; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; color: white; font-weight: bold; margin-top: 5px; cursor: pointer; }

        /* 🟦 منطقة المنتجات والأقسام */
        .main { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .categories { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 10px; border-bottom: 1px solid #ddd; }
        .cat-btn-wrapper { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .cat-btn { padding: 8px 15px; border: 2px solid var(--accent); background: white; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .cat-btn.active { background: var(--accent); color: white; }
        .edit-pen { font-size: 11px; background: #f39c12; color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; display: none; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; flex-grow: 1; }
        .prod-card { background: white; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; border-bottom: 3px solid var(--accent); position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .del-x { color: red; cursor: pointer; font-weight: bold; position: absolute; top: 5px; left: 5px; display: none; }

        /* ⚙️ لوحة الإدارة في الأسفل */
        .admin-box { margin-top: 20px; padding: 15px; background: #fff; border: 1px dashed var(--accent); border-radius: 10px; }
        #adminPanel { border-top: 1px solid #eee; margin-top: 10px; padding-top: 10px; }
        .admin-input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; margin: 2px; }

        @media print {
            @page { margin: 0; size: auto; }
            body { background: white; color: #000 !important; }
            .main, .no-print { display: none !important; }
            .sidebar { width: 85% !important; margin: 0 auto !important; border: none !important; text-align: center !important; }
            .item-note-print { display: block !important; font-weight: bold; margin-top: 5px; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="logo-container">
            <img src="logo.jpg" alt="الشعار" onerror="this.src='https://via.placeholder.com/100?text=LOGO'">
        </div>
        <h3 style="margin:0">مطاعم ديرتي 💙</h3>
        <small>رقم الطلب: <span id="invDisplay">1008</span></small>
    </div>

    <div class="booking-header">
        <h4>فاتورة حجز مؤقت</h4>
        <p>📞 0112020203</p>
    </div>

    <div class="client-info">
        <input id="cPhone" type="tel" placeholder="📱 رقم جوال العميل">
        <input id="cTime" type="text" placeholder="📅 الموعد">
        <input id="cLoc" type="text" placeholder="📍 الموقع / العنوان">
    </div>

    <div id="cartItems" class="cart-content"></div>

    <div class="footer-total">
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.3em;">
            <span>الإجمالي:</span>
            <span><span id="finalTotal">0.00</span> ر.س</span>
        </div>
        <button class="btn no-print" style="background:var(--blue)" onclick="printOrder()">🖨️ طباعة الفاتورة</button>
        <button class="btn no-print" style="background:#27ae60" onclick="sendWA()">📲 واتساب شامل</button>
        <button class="btn no-print" style="background:#95a5a6" onclick="clearCart()">🗑️ طلب جديد</button>
    </div>
</div>

<div class="main">
    <div id="catList" class="categories"></div>
    
    <div id="prodGrid" class="products-grid"></div>

    <div class="admin-box no-print">
        <button id="lockBtn" onclick="toggleLock()" style="background:#f39c12; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">🔓 فتح تعديل القائمة</button>
        
        <div id="adminPanel" style="display:none;">
            <div style="margin-bottom: 10px;">
                <input id="newCatName" class="admin-input" placeholder="اسم القسم الجديد"> 
                <button class="btn" style="background:var(--accent); width:auto; padding:6px 12px;" onclick="addNewCat()">+ إضافة قسم</button>
            </div>
            <hr>
            <div>
                <select id="catSelect" class="admin-input"></select>
                <input id="newPName" class="admin-input" placeholder="اسم الصنف"> 
                <input id="newPPrice" type="number" class="admin-input" placeholder="السعر">
                <button class="btn" style="background:#27ae60; width:auto; padding:6px 12px;" onclick="addNewProd()">+ إضافة صنف</button>
            </div>
        </div>
    </div>
</div>

<script>
    // استعادة البيانات من التخزين المحلي أو إنشاء بيانات افتراضية
    let db = JSON.parse(localStorage.getItem('sh_db')) || [{name: "العامة", items: []}];
    let cart = []; 
    let curCat = 0; 
    let isLocked = true;
    let invNum = localStorage.getItem('sh_inv') || 1008;

    function init() { 
        renderCats(); 
        renderProds(); 
        document.getElementById('invDisplay').innerText = invNum; 
    }

    function renderCats() {
        const list = document.getElementById('catList'); 
        const sel = document.getElementById('catSelect');
        list.innerHTML = ''; sel.innerHTML = '';
        db.forEach((c, i) => {
            list.innerHTML += `
                <div class="cat-btn-wrapper">
                    <button class="cat-btn ${i==curCat?'active':''}" onclick="setCat(${i})">${c.name}</button>
                    <button class="edit-pen" onclick="editCat(${i})">✏️</button>
                </div>`;
            sel.innerHTML += `<option value="${i}">${c.name}</option>`;
        });
        document.querySelectorAll('.edit-pen').forEach(el => el.style.display = isLocked ? 'none' : 'inline-block');
    }

    function renderProds() {
        const grid = document.getElementById('prodGrid'); 
        grid.innerHTML = '';
        db[curCat].items.forEach((p, i) => {
            grid.innerHTML += `
                <div class="prod-card" onclick="addToCart('${p.name}', ${p.price})">
                    <span class="del-x" onclick="event.stopPropagation(); deleteProd(${i})">❌</span>
                    <b>${p.name}</b><br><small>${p.price} ر.س</small>
                </div>`;
        });
        document.querySelectorAll('.del-x').forEach(el => el.style.display = isLocked ? 'none' : 'block');
    }

    function addToCart(name, price) {
        let existing = cart.find(item => item.name === name);
        if(existing) { existing.qty++; } 
        else { cart.push({name, price, qty: 1, note: ""}); }
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItems'); container.innerHTML = '';
        cart.forEach((item, i) => {
            container.innerHTML += `
                <div class="cart-item">
                    <div class="item-main">
                        <span>${item.name} (x${item.qty})</span>
                        <span>${item.price * item.qty} ر.س</span>
                    </div>
                    <input class="item-note no-print" placeholder="أضف ملاحظة..." value="${item.note}" oninput="cart[${i}].note=this.value; updateTotal()">
                    <div class="item-note-print">${item.note ? '📝: ' + item.note : ''}</div>
                </div>`;
        });
        updateTotal();
    }

    function updateTotal() {
        let total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
        document.getElementById('finalTotal').innerText = total.toFixed(2);
    }

    function setCat(i) { curCat = i; renderCats(); renderProds(); }

    function toggleLock() { 
        isLocked = !isLocked; 
        document.getElementById('adminPanel').style.display = isLocked ? 'none' : 'block'; 
        document.getElementById('lockBtn').innerText = isLocked ? '🔓 فتح تعديل القائمة' : '🔒 قفل القائمة'; 
        renderCats(); renderProds(); 
    }

    function addNewCat() { 
        let n = document.getElementById('newCatName').value; 
        if(n) { db.push({name: n, items: []}); save(); renderCats(); } 
    }

    function addNewProd() {
        let c = document.getElementById('catSelect').value, n = document.getElementById('newPName').value, p = document.getElementById('newPPrice').value;
        if(n && p) { db[c].items.push({name: n, price: parseFloat(p)}); save(); renderProds(); }
    }

    function deleteProd(i) { if(confirm("حذف الصنف؟")) { db[curCat].items.splice(i, 1); save(); renderProds(); } }
    
    function editCat(i) { let n = prompt("الاسم الجديد للقسم:", db[i].name); if(n) { db[i].name = n; save(); renderCats(); } }

    function save() { localStorage.setItem('sh_db', JSON.stringify(db)); }

    function printOrder() { window.print(); invNum++; localStorage.setItem('sh_inv', invNum); document.getElementById('invDisplay').innerText = invNum; }

    function sendWA() {
        let ph = document.getElementById('cPhone').value;
        if(!ph) return alert("يرجى إدخال رقم الجوال!");
        let message = `🧾 *فاتورة حجز - مطاعم ديرتي*%0A🔢 *رقم الطلب:* ${invNum}%0A--------------------------%0A`;
        cart.forEach(item => {
            message += `🔹 *${item.name}* (x${item.qty}) = ${item.price * item.qty} ر.س%0A`;
            if(item.note) message += `   📌 ملاحظة: ${item.note}%0A`;
        });
        message += `--------------------------%0A💰 *الإجمالي: ${document.getElementById('finalTotal').innerText} ر.س*%0A📅 *الموعد:* ${document.getElementById('cTime').value}%0A📍 *الموقع:* ${document.getElementById('cLoc').value}`;
        window.open(`https://wa.me/966${ph}?text=${message}`);
    }

    function clearCart() { if(confirm("طلب جديد؟")) { cart = []; renderCart(); } }

    init();
</script>
</body>
</html>
